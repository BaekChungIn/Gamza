# 짬타이거 · Supabase Edge Functions 자동 배포
# supabase/functions/ 안의 파일을 GitHub 에 올리면 자동으로 Supabase 에 배포돼요.
# 필요한 것: GitHub 저장소 Settings > Secrets and variables > Actions 에
#   SUPABASE_ACCESS_TOKEN  (Supabase 계정 > Access Tokens 에서 만든 토큰)
name: Deploy Supabase functions
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: fziblqwqtyhntmmvzhgv
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # transit-live: 로그인 확인을 코드 안에서 해요 → Verify JWT 끔
      # --yes: 새 버전 CLI 는 배포 전에 확인을 물어봐서, 자동으로 '예' 처리
      - name: transit-live
        continue-on-error: true
        if: hashFiles('supabase/functions/transit-live/index.ts') != ''
        run: supabase functions deploy transit-live --project-ref $PROJECT_REF --no-verify-jwt --use-api --yes
      # mnd-meal: Verify JWT 켬 (지금 설정 그대로)
      - name: mnd-meal
        if: hashFiles('supabase/functions/mnd-meal/index.ts') != ''
        run: supabase functions deploy mnd-meal --project-ref $PROJECT_REF --use-api --yes
